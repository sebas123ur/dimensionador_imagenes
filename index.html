<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimensionador de Imágenes Universal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }
        p.subtitle {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        .card {
            background: #1f2937;
            border-radius: 8px;
            padding: 1.5rem;
            border: 1px solid #374151;
        }
        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: #e5e7eb;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 0.4rem;
        }
        select, input {
            width: 100%;
            padding: 0.6rem;
            background: #111827;
            border: 1px solid #4b5563;
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
        }
        .preview-box {
            border: 2px dashed #4b5563;
            border-radius: 8px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #9ca3af;
            font-size: 0.9rem;
            background: #111827;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Optimizador Universal</h1>
        <p class="subtitle">Prepara iconos, banners y assets para web y Android sin dolores de cabeza.</p>

        <div class="grid">
            <!-- Configuración -->
            <div class="card">
                <h2>Configuración</h2>
                <div class="form-group">
                    <label>Nombre base</label>
                    <input type="text" value="mi-icono">
                </div>
                <div class="form-group">
                    <label>Formato de salida</label>
                    <select>
                        <option>PNG (Transparente)</option>
                        <option>JPG</option>
                        <option>WEBP</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tamaño de salida</label>
                    <select>
                        <option>48x48px - Ícono</option>
                        <option>512x512px - Play Store</option>
                        <option>1024x500px - Banner</option>
                    </select>
                </div>
            </div>

            <!-- Vista Previa -->
            <div class="card">
                <h2>Vista previa</h2>
                <div class="preview-box">
                    Arrastra tu imagen o haz clic para importar
                </div>
            </div>
        </div>
    </div>

</body>
</html>
